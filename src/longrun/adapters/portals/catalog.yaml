# Tier 3: open-data portal datasets, as data (M21, ADR 0060). Read by `catalog.py`.
#
# `adopted:` rows become adapters through one entry point. Each says where the dataset is,
# how its columns map onto a `Feature` - in five mapping kinds and no more: field, const,
# map, template, point - what its own metadata declared as a licence on the day it was read,
# and what the adopting survey measured.
#
# `refused:` rows are decisions too. Every one of the fifty largest places has, for closures
# and for speed surveys, an adoption or a refusal with a reason from the closed set in
# `catalog.RefusalReason` and what was checked (`test_largest_places_are_decided.py`).
#
# `longrun survey-portal` prints a stub for an adopted row; it never writes this file.

adopted:
  # --- Socrata (M21.4) ------------------------------------------------------

  # NYC DOT's own closures: every block a permitted construction activity closes, with the
  # dates it holds. Lines, so a closure along the route can be told from one across it.
  - name: portal.socrata.nyc-street-closures-block
    jurisdiction: tiger:place:3651000
    kind: closures
    platform: socrata
    domain: data.cityofnewyork.us
    dataset: i6b5-j7bu
    source: portal_nyc
    zone: America/New_York
    geometry: {kind: field, field: the_geom}
    category: {kind: const, value: road-closure}
    start: {kind: field, field: work_start_date, format: date}
    end: {kind: field, field: work_end_date, format: date}
    detail: {kind: template, template: "{purpose}: {onstreetname} from {fromstreetname} to {tostreetname}"}
    ref: {kind: field, field: uniqueid}
    label: {kind: field, field: onstreetname}
    licence: {id: null, read_on: 2026-10-28, from: "https://data.cityofnewyork.us/api/views/i6b5-j7bu.json"}
    survey: {read_on: 2026-10-28, rows: 4466, updated: 2026-10-26, max_staleness_days: 14}
    note: >-
      Street Closures due to Construction Activities by Block. 4,466 rows, every one with
      a window; the dataset declares no licence, so no payload is committed.

  # The same closures where they fall on an intersection rather than a block: points. A
  # facet of its own, because it describes different ground from the block table and both
  # are asked: on one facet they would be two complete answers racing for one ladder.
  - name: portal.socrata.nyc-street-closures-intersection
    jurisdiction: tiger:place:3651000
    kind: closures
    facet: closures.intersections
    platform: socrata
    domain: data.cityofnewyork.us
    dataset: 478a-yykk
    source: portal_nyc
    zone: America/New_York
    geometry: {kind: field, field: the_geom}
    category: {kind: const, value: road-closure}
    start: {kind: field, field: work_start_date, format: date}
    end: {kind: field, field: work_end_date, format: date}
    detail: {kind: template, template: "{purpose}: {onstreetname} at {fromstreetname}"}
    ref: {kind: field, field: uniqueid}
    licence: {id: null, read_on: 2026-10-28, from: "https://data.cityofnewyork.us/api/views/478a-yykk.json"}
    survey: {read_on: 2026-10-28, rows: 1721, updated: 2026-10-26, max_staleness_days: 14}

  # CDOT's permits, kept to the ones that close something and are being worked: the table
  # holds 2.3 million permits back to 2016, most of them driveways and curb-lane bagging.
  - name: portal.socrata.chicago-cdot-permit-closures
    jurisdiction: tiger:place:1714000
    kind: closures
    platform: socrata
    domain: data.cityofchicago.org
    dataset: pubx-yq2d
    source: portal_chicago
    zone: America/Chicago
    geometry: {kind: point, lat: latitude, lon: longitude}
    category:
      kind: map
      field: streetclosure
      values:
        Full: road-closure
        Sidewalk: sidewalk-closed
        Partial: some-lanes-closed
        Intermitte: intermittent-closure
    start: {kind: field, field: applicationstartdate, format: local}
    end: {kind: field, field: applicationenddate, format: local}
    detail:
      kind: template
      template: "{worktypedescription} at {streetnumberfrom} {direction} {streetname} {suffix}: {streetclosure} closure"
    ref: {kind: field, field: applicationnumber}
    label: {kind: field, field: streetname}
    where: "streetclosure in ('Full','Partial','Sidewalk','Intermitte') AND applicationstatus = 'Open' AND currentmilestone in ('Inspection','Permit Active')"
    licence: {id: SEE_TERMS_OF_USE, read_on: 2026-10-28, from: "https://data.cityofchicago.org/api/views/pubx-yq2d.json"}
    survey: {read_on: 2026-10-28, rows: 2173, updated: 2026-10-26, max_staleness_days: 14}
    note: >-
      Transportation Department Permits. 2,173 open permits in inspection or active close
      something on or after 2026-10-27: the street (Full), part of it, or the sidewalk.
      Points at the permit's address. "See Terms of Use" is a permission to read, so no
      payload is committed.

  # Right-of-way permits drawn as the lines they occupy. Utility work mostly; the permit
  # says what is being done and where, not which lanes close, so it is a soft note.
  - name: portal.socrata.dallas-row-permits
    jurisdiction: tiger:place:4819000
    kind: closures
    platform: socrata
    domain: www.dallasopendata.com
    dataset: xd3q-ipis
    source: portal_dallas
    zone: America/Chicago
    geometry: {kind: field, field: the_geom}
    category: {kind: const, value: right-of-way-work}
    start: {kind: field, field: rowrequestedstartdate, format: date}
    end: {kind: field, field: rowestimatedcompletiondate, format: date}
    detail: {kind: template, template: "{rowimprovementrepair} ({rowreasonforjob}): {workdescription}"}
    ref: {kind: field, field: externalfilenum}
    where: "statusdescription = 'Issued'"
    licence: {id: null, read_on: 2026-10-28, from: "https://www.dallasopendata.com/api/views/xd3q-ipis.json"}
    survey: {read_on: 2026-10-28, rows: 2406, updated: 2026-10-20, max_staleness_days: 14}
    note: >-
      ROW Permits - Lines. 2,406 issued permits run to 2026-10-27 or later. The city's
      "ROW Restrictions" (8hyu-vkvq) looked like closures and is holiday moratoria around
      shopping malls, so it was not adopted.

  # Seattle's street closures are events: block parties, play streets, farmers markets.
  # Closed to cars and open to people, so they are a note and never a barrier.
  - name: portal.socrata.seattle-street-closures
    jurisdiction: tiger:place:5363000
    kind: closures
    platform: socrata
    domain: data.seattle.gov
    dataset: ium9-iqtc
    source: portal_seattle
    zone: America/Los_Angeles
    geometry: {kind: field, field: line_string}
    category: {kind: const, value: street-event}
    start: {kind: field, field: start_date, format: date}
    end: {kind: field, field: end_date, format: date}
    detail: {kind: template, template: "{permit_type}: {project_name}"}
    ref: {kind: field, field: permit_number}
    label: {kind: field, field: street_on}
    licence: {id: PUBLIC_DOMAIN, read_on: 2026-10-28, from: "https://data.seattle.gov/api/views/ium9-iqtc.json"}
    survey: {read_on: 2026-10-28, rows: 104, updated: 2026-10-27, max_staleness_days: 14}
    note: >-
      Street Closures, 104 rows: block parties, play streets, farmers markets and temporary
      activations. Public domain, so a payload is committed as a contract cassette.

  # SFMTA's temporary street closures (M21.6): special events, special traffic permits and
  # the rest, with WZDx's own vehicle-impact words. Kept to permitted closures that close
  # something; "Roadway Shared Spaces" are standing parklets in the parking lane, not
  # closures anybody runs into. Dedicated to the public domain (PDDL).
  - name: portal.socrata.sf-temporary-street-closures
    jurisdiction: tiger:place:0667000
    kind: closures
    platform: socrata
    domain: data.sf.gov
    dataset: 8x25-yybr
    source: portal_sf
    zone: America/Los_Angeles
    geometry: {kind: field, field: shape}
    category:
      kind: map
      field: veh_imp
      values: {all-lanes-closed: road-closure, some-lanes-closed: some-lanes-closed}
    start: {kind: field, field: start_dt, format: local}
    end: {kind: field, field: end_dt, format: local}
    detail: {kind: template, template: "{type} ({case_name}): {loc_desc}"}
    ref: {kind: field, field: case_num}
    label: {kind: field, field: street}
    where: "status = 'Permitted' AND veh_imp <> 'all-lanes-open' AND type <> 'Roadway Shared Spaces'"
    licence: {id: PDDL, read_on: 2026-10-28, from: "https://data.sf.gov/api/views/8x25-yybr.json"}
    survey: {read_on: 2026-10-28, rows: 3992, updated: 2026-10-27, max_staleness_days: 14}
    note: >-
      3,992 rows. From 2026-10-27 on: 2,777 permitted shared spaces (filtered out), 593
      permitted special events closing every lane, 272 special traffic permits closing
      some. Its start_utc/end_utc are local time shifted by a fixed eight hours, an hour
      wrong all summer, so the local start_dt/end_dt are read instead. The portal moved
      from data.sfgov.org to data.sf.gov.

  # --- Speed surveys (M21.8) ------------------------------------------------

  # Oakland DOT's tube counts: each a street segment, drawn as a line, with the 85th- and
  # 95th-percentile speeds the count measured, in mph, and the day it was taken. What the
  # M18 build step merges onto the ways it measured (ADR 0053). Read whole, once a day.
  - name: portal.arcgis.oakland-85th-percentile-speeds
    jurisdiction: tiger:place:0653000
    kind: speed_survey
    platform: arcgis
    domain: services.arcgis.com
    dataset: /9tC74aDHuml0x5Yz/arcgis/rest/services/Oakland_Speed_Limits__ADT__and_85th_Percentile_Speeds_WFL1/FeatureServer/8
    source: portal_oakland
    zone: America/Los_Angeles
    geometry: {kind: field, field: geometry}
    category: {kind: const, value: speed-survey}
    measures:
      speed_85_kph: {kind: field, field: F85_PCT_SD, unit: mph}
    observed_on: {kind: field, field: COUNTDATED, format: epoch_ms_date}
    label: {kind: field, field: STREET}
    ref: {kind: field, field: GIS_ID}
    detail:
      kind: template
      template: "{STREET} from {ST_BEGIN} to {ST_END}: 85th percentile {F85_PCT_SD} mph ({SOURCE_MET}, {COUNT_YEAR})"
    scope: feed
    licence: {id: null, read_on: 2026-10-28, from: "https://services.arcgis.com/9tC74aDHuml0x5Yz/arcgis/rest/services/Oakland_Speed_Limits__ADT__and_85th_Percentile_Speeds_WFL1/FeatureServer/8?f=json"}
    survey: {read_on: 2026-10-28, rows: 356, updated: 2025-11-26, max_staleness_days: 730}
    note: >-
      "85th Percentile Speed (Batch #2)", 356 segments counted 2019-2025 by tube counter.
      A survey ages in years: a street's speed does not change because nobody re-counted
      it this month, so the table is refused only past two years without an edit.

  # --- ArcGIS (M21.5) -------------------------------------------------------

  # Phoenix Street Transportation's planned restrictions along streets, the layer behind
  # the city's CKAN "Traffic Restrictions Streets" (cc-by there; an ArcGIS layer declares
  # nothing). A map service with no editingInfo, so its newest start date dates it. Its
  # dates are text, so the window is applied after mapping, not in the query.
  - name: portal.arcgis.phoenix-traffic-restrictions
    jurisdiction: tiger:place:0455000
    kind: closures
    platform: arcgis
    domain: maps.phoenix.gov
    dataset: /pub/rest/services/Public/TrafficRestrictions/MapServer/1
    source: portal_phoenix
    zone: America/Phoenix
    geometry: {kind: field, field: geometry}
    category:
      kind: map
      field: ClosureType
      values: {Full: road-closure, Partial: some-lanes-closed}
      default: restriction
    start: {kind: field, field: StartDate, format: date}
    end: {kind: field, field: EndDate, format: date}
    detail:
      kind: template
      template: "{RestrictionType} restriction on {OnStreet} from {FromStreet} to {ToStreet}: {LanesMaintained} {PedestrianAccess}"
    ref: {kind: field, field: TRACSPermit}
    label: {kind: field, field: OnStreet}
    where: "RestrictionType <> 'Meter'"
    window_filter: false
    freshness_field: StartDate
    licence: {id: null, read_on: 2026-10-28, from: "https://maps.phoenix.gov/pub/rest/services/Public/TrafficRestrictions/MapServer/1?f=json"}
    survey: {read_on: 2026-10-28, rows: 1529, updated: 2026-10-27, max_staleness_days: 14}
    note: >-
      1,529 restrictions: 981 street, 349 sidewalk, 199 parking meter (filtered out). Full
      closures are road-closure and partial ones some-lanes-closed.

  # Nashville's Road Closures solution layer: 4,043 lines with a lane impact and a window.
  - name: portal.arcgis.nashville-road-closures
    jurisdiction: tiger:place:4752006
    kind: closures
    platform: arcgis
    domain: services2.arcgis.com
    dataset: /HdTo6HJqh92wn4D8/arcgis/rest/services/RoadClosures_public_b6790041823f4ecf96e7a54e50276f00/FeatureServer/1
    source: portal_nashville
    zone: America/Chicago
    geometry: {kind: field, field: geometry}
    category: &laneimpact
      kind: map
      field: laneimpact
      values: {All Lanes: road-closure, Some Lanes: some-lanes-closed, Alternating One Way: some-lanes-closed}
      default: road-closure
    start: {kind: field, field: starttime, format: epoch_ms}
    end: {kind: field, field: endtime, format: epoch_ms}
    detail: {kind: template, template: "{reason}: {street} ({direction}) {description}"}
    ref: {kind: field, field: closureid}
    label: {kind: field, field: street}
    licence: {id: null, read_on: 2026-10-28, from: "https://services2.arcgis.com/HdTo6HJqh92wn4D8/arcgis/rest/services/RoadClosures_public_b6790041823f4ecf96e7a54e50276f00/FeatureServer/1?f=json"}
    survey: {read_on: 2026-10-28, rows: 4043, updated: 2026-10-28, max_staleness_days: 14}

  # Raleigh's active closures, the same Road Closures solution schema.
  - name: portal.arcgis.raleigh-road-closures
    jurisdiction: tiger:place:3755000
    kind: closures
    platform: arcgis
    domain: services.arcgis.com
    dataset: /v400IkDOw1ad7Yad/arcgis/rest/services/RoadClosures_Active/FeatureServer/1
    source: portal_raleigh
    zone: America/New_York
    geometry: {kind: field, field: geometry}
    category: *laneimpact
    start: {kind: field, field: starttime, format: epoch_ms}
    end: {kind: field, field: endtime, format: epoch_ms}
    detail: {kind: template, template: "{reason}: {street} ({direction}) {description}"}
    ref: {kind: field, field: closureid}
    label: {kind: field, field: street}
    licence: {id: null, read_on: 2026-10-28, from: "https://services.arcgis.com/v400IkDOw1ad7Yad/arcgis/rest/services/RoadClosures_Active/FeatureServer/1?f=json"}
    survey: {read_on: 2026-10-28, rows: 12, updated: 2026-10-27, max_staleness_days: 14}

  # Virginia Beach's road closures: every row a full closure.
  - name: portal.arcgis.virginia-beach-road-closures
    jurisdiction: tiger:place:5182000
    kind: closures
    platform: arcgis
    domain: services1.arcgis.com
    dataset: /iM09lHgNpufqQHem/arcgis/rest/services/RoadClosures_public_5f93f2a6d9584e55b5d9bbbc303e968b/FeatureServer/1
    source: portal_virginia_beach
    zone: America/New_York
    geometry: {kind: field, field: geometry}
    category: {kind: map, field: type, values: {ROAD_CLOSED: road-closure}, default: road-closure}
    start: {kind: field, field: starttime, format: epoch_ms}
    end: {kind: field, field: endtime, format: epoch_ms}
    detail: {kind: template, template: "{street} from {from_street} to {to_street}: {description}"}
    label: {kind: field, field: street}
    licence: {id: null, read_on: 2026-10-28, from: "https://services1.arcgis.com/iM09lHgNpufqQHem/arcgis/rest/services/RoadClosures_public_5f93f2a6d9584e55b5d9bbbc303e968b/FeatureServer/1?f=json"}
    survey: {read_on: 2026-10-28, rows: 444, updated: 2026-10-16, max_staleness_days: 14}

  # Atlanta DPW's road closures, kept to the active ones.
  - name: portal.arcgis.atlanta-road-closures
    jurisdiction: tiger:place:1304000
    kind: closures
    platform: arcgis
    domain: services2.arcgis.com
    dataset: /zLeajbicrDRLQcny/arcgis/rest/services/Road_Detours_and_Closures/FeatureServer/2
    source: portal_atlanta
    zone: America/New_York
    geometry: {kind: field, field: geometry}
    category: {kind: map, field: FULLCLOSE, values: {"Yes": road-closure, "No": some-lanes-closed}, default: some-lanes-closed}
    start: {kind: field, field: STARTDATE, format: epoch_ms}
    end: {kind: field, field: ENDDATE, format: epoch_ms}
    detail: {kind: template, template: "{BLOCKNM} {LOCDESC} ({BLOCKTYPE}) {COMMENT}"}
    ref: {kind: field, field: PERMITID}
    where: "ACTIVE = 'Yes'"
    licence: {id: null, read_on: 2026-10-28, from: "https://services2.arcgis.com/zLeajbicrDRLQcny/arcgis/rest/services/Road_Detours_and_Closures/FeatureServer/2?f=json"}
    survey: {read_on: 2026-10-28, rows: 537, updated: 2026-10-15, max_staleness_days: 30}
    note: >-
      537 closures, 93 marked active. Edited every few weeks rather than daily, so 30 days
      of staleness before it is refused.

  # Louisville Metro Public Works' right-of-way construction permits: points, with the
  # closure each permits named in WORK_TYPE.
  - name: portal.arcgis.louisville-row-permits
    jurisdiction: tiger:place:2148006
    kind: closures
    platform: arcgis
    domain: services1.arcgis.com
    dataset: /79kfd2K6fskCAkyg/arcgis/rest/services/Louisville_KY_ROW_Construction_Permits_new/FeatureServer/0
    source: portal_louisville
    zone: America/Kentucky/Louisville
    geometry: {kind: field, field: geometry}
    category:
      kind: map
      field: WORK_TYPE
      values:
        Road Closure: road-closure
        Excavation ,Road Closure: road-closure
        Lane Closure ,Road Closure: road-closure
        Lane Closure: some-lanes-closed
        Excavation ,Lane Closure: some-lanes-closed
        Excavation ,Lane Closure ,Utility Cut: some-lanes-closed
        Lane Closure ,Utility Cut: some-lanes-closed
      default: right-of-way-work
    start: {kind: field, field: FROM_DATE, format: epoch_ms_date}
    end: {kind: field, field: TO_DATE, format: epoch_ms_date}
    detail: {kind: template, template: "{WORK_TYPE} at {STREET_ADDRESS} ({APPLICANT_NAME})"}
    ref: {kind: field, field: PERMIT_NO}
    licence: {id: null, read_on: 2026-10-28, from: "https://services1.arcgis.com/79kfd2K6fskCAkyg/arcgis/rest/services/Louisville_KY_ROW_Construction_Permits_new/FeatureServer/0?f=json"}
    survey: {read_on: 2026-10-28, rows: 286, updated: 2026-10-25, max_staleness_days: 14}

