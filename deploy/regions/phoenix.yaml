# Phoenix - scope 11's test region 2, and the region ADR 0004 named as the trigger
# for revisiting the WBGT formulation.
#
# The second region, which is the point: everything about a region build that is really
# Bay-Area-shaped shows up the first time a different polygon runs through it.
#
#   uv run longrun build-region deploy/regions/phoenix.yaml

name: phoenix
polygon: phoenix.geojson

# Clipped from Geofabrik arizona-latest by clip_pbf.py: 287 MB in, 114 MB out.
osm_extract: ../../data/osm/phoenix.osm.pbf

# 1506 Middle Gila, 1507 Lower Gila, 1503 Verde. The Salt and the Gila run through the
# metro area and both are dry most of the year, which is exactly the case `hazards` marks
# as a possible crossing at reduced confidence rather than a ford.
huc4:
  - "1506"

# None loaded. Valley Metro publishes GTFS and it is not here, so `transit` and `bailouts`
# report what the loaded feeds say - nothing - rather than what Phoenix has. The coverage
# manifest is where that distinction has to survive.
gtfs: {}

# Endpoint pairs for `verify_lts_routing.py --region phoenix`. Region 2's arterials are wide,
# fast and gridded at a mile spacing, so the parallel residential street the LTS term wants is
# often half a mile away - the case between the Bay Area's dense grid and the Ozarks' single
# highway.
verify_pairs:
  - name: "downtown Phoenix, west to east"
    from: [33.4515, -112.0850]
    to: [33.4515, -112.0300]
  - name: "Roosevelt Row -> Encanto Park"
    from: [33.4590, -112.0680]
    to: [33.4730, -112.0930]
