name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # windows-latest is primary: development happens on Windows, and the geospatial
    # stack's path, locale and CRLF failures are Windows-specific. Linux-only CI would
    # let Windows-breaking code land daily.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Raised from 15 on 2026-09-13, after M5's push hit it: the Windows job was cancelled
    # mid-`pytest` at 14m17s of testing, having grown from 11m5s before the fifth golden.
    # M0 set 15 with the note that keeping CI short "is itself the enforcement mechanism
    # for small fixtures", which was right and is now doing the wrong job - the fixtures
    # are inside their cap and it is the test count that grew, from 502 to 1,246.
    # 30 restores headroom without removing the pressure; the day this is hit again the
    # answer is to look at what got slow, not to raise it again.
    #
    # **That rule was applied in M10 and it worked.** ADR 0031's amendment ran
    # `pytest --durations` rather than raising anything: the golden tier was 272 s of a
    # 306 s suite because four tests each ran a full pipeline per route, and a
    # session-scoped fixture took the whole suite to 85 s. So the 26m2s figure this comment
    # used to quote is from before that and is not current - and M13 has not replaced it,
    # because a Windows wall clock can only be measured by a Windows run. Locally the
    # hermetic suite is ~90 s with seven golden routes. Read the next main-branch run for
    # the real number; do not trust one written here.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        # Every extra whose package `mypy` type-checks. M5 added tools/agent/history and
        # M7 adds api; `uv run mypy` checks the whole `longrun` package, and a gate that
        # cannot see the code it guards is not a gate - M4.4a's lesson in a new costume.
        run: uv sync --frozen --extra dev --extra tools --extra agent --extra history --extra api

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # `network` needs live services; `slow` holds budget assertions (scope 6.4).
      # The `postgis` subset of `network` runs in the `contract` job below.
      - name: Test
        run: uv run pytest -m "not network and not slow" --cov=longrun --cov-report=term-missing

  # M12.8. `ui/` had no automated verification of any kind: `package.json` carried
  # `typecheck` and no test runner, and this workflow never entered the directory - so the
  # only thing between a regression and `main` was somebody opening a browser. That is not
  # a gap worth noting in a milestone that adds five write paths to those components; it is
  # the only thing that will catch a regression in that milestone's own work.
  #
  # Its own job, on ubuntu only, and that is two decisions.
  #
  # **Not added to `test`.** That job's Windows leg is primary because the geospatial
  # stack's path, locale and CRLF failures are Windows-specific, and it ran 26m2s against a
  # 30-minute timeout after M9. Node has none of those failure modes - nothing under test
  # here touches a filesystem or a locale - so a second leg would buy no coverage and spend
  # a budget that M6's rule says to watch rather than raise.
  #
  # **One leg, not a matrix**, for the same reason: `vitest run` over pure functions gives
  # the same answer on both operating systems, and a matrix that cannot disagree with
  # itself is a bill rather than a test.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      # `tsc --noEmit` existed and nothing ran it. It is the weaker of the two: the types
      # in `api.ts` are hand-written against the plan schema, so it checks them against
      # each other rather than against the server - which is how `TradeOff.options`
      # type-checked for five milestones while throwing on every plan that had one.
      - name: Type check
        working-directory: ui
        run: npm run typecheck

      - name: Test
        working-directory: ui
        run: npm test


  # The contract tier that needs a database, on the one leg that can host one.
  #
  # **Not a third matrix entry, and not an oversight.** GitHub's `services:` are Docker
  # containers, and Docker containers do not run on the Windows runner - a `services:` block
  # on `windows-latest` fails the job before a step runs. So this is ubuntu-only, and the
  # asymmetry is deliberate: 44 tests that have never run anywhere but a developer's laptop
  # now run on every pull request, on one platform rather than none. See ADR 0034.
  #
  # What this does *not* cover, and the reason each stays out:
  #
  #   * `test_way_lts_table` needs a built region - 1,600 Ozarks ways loaded by
  #     `longrun build-region` - and a service container starts empty. The five modules
  #     below all seed their own scratch schemas, which is why they can run here at all.
  #   * `test_graphhopper`, `test_wzdx`, `test_tiles_live`, `test_forecast_providers`,
  #     `test_keyed_adapters` and `test_agent_model` need the internet or a key, not a
  #     database. Those stay `network` and stay out of CI.
  contract:
    runs-on: ubuntu-latest
    # A tenth of the `test` job's budget: 44 tests, 42 s locally, and no golden fixtures
    # read. If this ever approaches 15 the thing to look at is what got slow.
    timeout-minutes: 15

    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          # Matches deploy/docker-compose.yml and `postgis.DEFAULT_DSN`, which is what the
          # tests fall back to: `conftest._clear_longrun_env` deletes every `LONGRUN_*`
          # variable before each test, so an exported DSN could not reach them anyway.
          POSTGRES_USER: longrun
          POSTGRES_PASSWORD: longrun
          POSTGRES_DB: longrun
          # Byte-ordinal collation, for the reason the compose file gives: a fixture frozen
          # from a query is reproducible only while row ordering does not depend on the
          # host's locale. `test_text_ordering_is_platform_stable` asserts it.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U longrun -d longrun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - name: Apply the schema the loaders expect
        # Locally `deploy/postgis/init/` is mounted into `docker-entrypoint-initdb.d`. A
        # service container has no repository to mount: it starts before `checkout` runs.
        # Applying the same file with `psql` afterwards executes the same statements, and
        # it is what makes `test_postgis_schema` a check on the committed SQL rather than
        # on whatever a long-lived container happens to hold.
        env:
          PGPASSWORD: longrun
        run: |
          psql -h localhost -U longrun -d longrun -v ON_ERROR_STOP=1 \
            -f deploy/postgis/init/01-schemas.sql

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        # The `test` job's extras plus `ingest`. `test_osm_load` needs pyosmium and 8 of
        # the 44 skip without it; `ingest` is kept off the `test` job because `mypy`'s
        # override list says so - osmium ships stubs, so a job with it installed type
        # checks differently from one without, and the gate must be the same on both legs.
        run: >-
          uv sync --frozen --extra dev --extra tools --extra agent --extra history
          --extra api --extra ingest

      - name: Contract tests against PostGIS
        # Selected by marker rather than by a list of paths, so a new database-backed
        # module joins this job by carrying `postgis` and nothing here has to be edited.
        run: uv run pytest -m postgis

  # M15. The browser tier: the five scope 10.3 gestures driven against a real page, a real
  # `longrun api` and a real MapLibre canvas. Until this milestone `ui/README.md` said
  # plainly that "nothing verifies a gesture" and that a headless run could not; the first
  # commit of M15 measured whether that was still true and found it was not.
  #
  # **A fourth job rather than a step on `ui`**, and the reason is what it costs. `ui` is
  # `npm ci` plus two commands over pure functions and finishes in well under a minute;
  # this needs Python, uv, the golden fixtures, a Chromium download and a server, and runs
  # a minute of browser on top. Folding them together would make a ten-minute budget cover
  # two very different things and would stop a vitest regression being legible on its own.
  #
  # **Not a step on `test` either.** That matrix has no headroom - M6's rule is to watch the
  # budget rather than raise it - and its Windows leg is primary for path, locale and CRLF
  # failures that have nothing to do with a browser.
  #
  # **Ubuntu only, Chromium only.** MapLibre GL 5.x needs WebGL 2 and a headless browser
  # gives it a software rasteriser; Chromium's is ANGLE over SwiftShader and it is the one
  # M15.1 measured - 25 launches, 25 clean resolutions of a rendered query. Firefox and
  # WebKit would be three rasterisers to keep honest instead of one, for behaviour that is
  # the application's rather than the browser's. `retries: 0` is set in the Playwright
  # config on purpose: a retry here is how a flaky browser job becomes one everybody learns
  # to re-run.
  gestures:
    runs-on: ubuntu-latest
    # Measured at ~2 minutes of tests locally on Windows, plus the Chromium download. 20
    # leaves room for a cold cache without leaving room for a suite that has got slow.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        # `api` is the one this job cannot do without - it serves the page under test - and
        # the rest are here because `longrun repair` seeds the plan through the same CLI the
        # golden suite uses, and a narrower install would be a second definition of what the
        # command needs.
        run: uv sync --frozen --extra dev --extra tools --extra agent --extra history --extra api

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Install Chromium
        working-directory: ui
        # `--with-deps` because a GitHub runner has none of the shared libraries a browser
        # links against. Chromium alone: see the note above on why there is no matrix here.
        run: npx playwright install --with-deps chromium

      - name: Gestures
        working-directory: ui
        # Builds `ui/dist` first and then serves it with `longrun api --ui ui/dist`, which
        # is one origin and is what `ui/README.md` tells a reviewer to run. The seeded plan
        # is generated from a golden at test time and written under the system temp
        # directory - `plans/` is gitignored for a reason and this suite does not argue
        # with it.
        run: npm run test:gestures

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gesture-traces
          path: ui/test-results/
          retention-days: 7
