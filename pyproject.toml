[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longrun"
version = "0.0.0"
description = "Long-run planner: verified routes and plan sheets for 20-100 km runs"
readme = "README.md"
# rasterio 1.5 declares >=3.12; the project targets 3.13 (see .python-version).
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Alan Wang" }]

# What M0-M1 actually import. Dependencies from the scope whose consumers have not landed
# yet live in the extras below, so a fresh `uv sync` stays fast and the lock stays small.
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6",
  # geospatial core
  "geopandas>=1.0",
  "shapely>=2",
  "pyproj>=3.6",
  "rasterio>=1.5",
  # track I/O
  "gpxpy>=1.6",
  # environment: solar geometry is needed by lighting/sun from M1
  "pvlib>=0.11",
  # stores
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# numba lands with the DSM ray-cast (scope 7.4, milestone M2).
raster = ["numba>=0.60"]
# fitdecode lands with run-history ingest (scope 6.2, milestone M5).
history = ["fitdecode>=0.10"]
# duckdb lands with Overture GeoParquet ingest (scope 4.4, milestone M3).
ingest = ["duckdb>=1.1"]
tools = ["mcp>=1.2"]
agent = ["pydantic-ai>=0.0.14", "anthropic>=0.40"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6",
  "respx>=0.21",
  "time-machine>=2.15",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-pyyaml",
]

[project.scripts]
longrun = "longrun.cli.main:app"

# Jurisdiction adapters register here (scope 7.10). Third-party packages can add entries
# under the same group; discovery is by entry point, not by import path.
[project.entry-points."longrun.adapters"]

[tool.hatch.build.targets.wheel]
packages = ["src/longrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "golden: end-to-end route regression, run through the CLI with no model in the loop",
  "contract: adapter contract test against a recorded response",
  "network: requires a live external service; skipped by default",
  "slow: budget and performance assertions; skipped in CI",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# Deliberately NOT docstring-code-format: the package docstrings document shell usage
# (`longrun plan request.yaml`), which ruff would de-indent as if it were Python.

[tool.mypy]
python_version = "3.13"
packages = ["longrun"]
strict = false

[[tool.mypy.overrides]]
# No type stubs published for the geospatial stack.
module = ["geopandas.*", "rasterio.*", "shapely.*", "pvlib.*", "gpxpy.*", "pyproj.*"]
ignore_missing_imports = true
