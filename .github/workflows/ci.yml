name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # windows-latest is primary: development happens on Windows, and the geospatial
    # stack's path, locale and CRLF failures are Windows-specific. Linux-only CI would
    # let Windows-breaking code land daily.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        # M5's extras are synced so mypy can see `tools/`, `agent/` and the history
        # ingest. `uv run mypy` type-checks the whole `longrun` package, and a gate that
        # cannot see the code it guards is not a gate - M4.4a's lesson in a new costume.
        run: uv sync --frozen --extra dev --extra tools --extra agent --extra history

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # `network` needs live services; `slow` holds budget assertions (scope 6.4).
      - name: Test
        run: uv run pytest -m "not network and not slow" --cov=longrun --cov-report=term-missing
