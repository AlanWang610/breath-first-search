# The pinned request for this golden. Absolute, never relative: a golden run on a
# moving date is a golden that cannot be reproduced, and a forecast for a past date can
# never be re-fetched.
#
# Times are local wall-clock and naive. There is no timezone field because nothing reads
# one yet - `FrozenClock` takes a naive datetime, and the scorers that will need a real
# offset (heat, lighting, microclimate) land in M2. It gets added here when it is read,
# not before.
date: 2026-09-12
start: "07:00"
target_km: 4.0
